name: Tala
description: >-
  Tala is an AI-native digital financial services company providing instant
  credit, digital wallets, money transfers, and cash-out services to
  underserved consumers in informal economies. Built on a proprietary,
  patent-pending credit-decisioning model trained on billions of dollars of
  lending data, Tala has delivered more than $7B in credit access to over 13
  million customers across Kenya, Mexico, the Philippines, India, Vietnam,
  Guatemala, Panama, and the Dominican Republic. The company also offers
  Embedded Credit infrastructure for partners. Tala reaches customers primarily
  through consumer mobile apps; no public developer API or documentation portal
  is currently published.
